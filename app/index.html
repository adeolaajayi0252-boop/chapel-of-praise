<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#005c47">
  <meta name="description" content="RCCG Chapel of Praise, Ibadan — worship, Word, fellowship and service">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/rccg-logo.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="assets/rccg-logo.jpg" alt="The Redeemed Christian Church of God logo">
      <div class="brand-copy">
        <strong>Chapel of Praise</strong>
        <small>THE REDEEMED CHRISTIAN CHURCH OF GOD</small>
        <span>Worship <i>•</i> Word <i>•</i> Fellowship <i>•</i> Service</span>
      </div>
    </div>
    <div class="top-actions">
      <button id="installBtn" class="icon-btn install-action" hidden aria-label="Install app">⇩</button>
      <button class="icon-btn" onclick="setTab('connect')" aria-label="Prayer and notifications">♧<span class="notification-dot"></span></button>
      <button class="icon-btn" onclick="setTab('profile')" aria-label="Open profile">☰</button>
    </div>
  </header>

  <main id="app"></main>

  <nav class="nav" aria-label="Main navigation">
    <button data-tab="home"><span class="nav-icon">⌂</span><span>Home</span></button>
    <button data-tab="calendar"><span class="nav-icon">▣</span><span>Events</span></button>
    <button data-tab="media"><span class="nav-icon">▶</span><span>Sermons</span></button>
    <button data-tab="connect"><span class="nav-icon">♧</span><span>Prayer</span></button>
    <button data-tab="profile"><span class="nav-icon">♙</span><span>Profile</span></button>
  </nav>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
